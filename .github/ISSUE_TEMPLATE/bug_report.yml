name: Something is wrong
description: A mod shows a wrong number, looks broken, or does not load.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One problem per report, please. If everything stopped working right after the game updated, use
        "Broke after a game update" instead: it asks for less.
  - type: dropdown
    id: mod
    attributes:
      label: Which mod?
      options:
        - Combat Simulator
        - Item Sources
        - Recipe Rates
        - Combat Goals
        - Kills in Combat
        - Dungeon Completions
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What did you do, and what happened?
      description: The steps that lead to it, and what you saw. A screenshot helps a lot.
      placeholder: |
        1. Opened Herblore.
        2. The list shows 9,120 XP/h for the first potion.
        3. Made that potion for ten minutes: the game's own average was about 7,000.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      placeholder: The number on the recipe to be close to what the game measures.
    validations:
      required: true
  - type: dropdown
    id: always
    attributes:
      label: Does it happen every time?
      options:
        - Every time
        - Sometimes
        - It happened once
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game version
      description: Shown at the top of the screen in the game.
      placeholder: 0.11.6-alpha.1
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Mod and loader version
      description: 'Both are in MelvorModLoader.log: "Melvor Mod Loader 0.2.0 starting" and "Mod loaded: RecipeRates 0.3.0".'
      placeholder: Recipe Rates 0.3.0, loader 0.2.0
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where is the mod from?
      options:
        - Nexus Mods
        - This repository's releases
        - I built it from the source
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: MelvorModLoader.log
      description: >
        The file is in the game folder and is rewritten on every start, so copy it right after the problem
        happened. These mods write no names into it; the loader writes your game folder's path, which you
        can remove.
      render: text
  - type: textarea
    id: others
    attributes:
      label: Other mods installed
      description: Anything else in the game's mods folder. If you can, say whether it still happens without them.
  - type: checkboxes
    id: checked
    attributes:
      label: Before sending
      options:
        - label: I have the newest release of the mod.
          required: true
        - label: I looked through the open issues and this one is not there yet.
          required: true
