name: Broke after a game update
description: The game got a new version and a mod stopped working, switched itself off or looks wrong since.
labels: ["bug", "game update"]
body:
  - type: markdown
    attributes:
      value: |
        The game is in early access, so this is expected now and then: a mod that no longer fits switches
        itself off and says so in the log. Telling us quickly is the most useful thing you can do. Look for
        an open report about the same game version first, and add to it if there is one.
  - type: input
    id: game
    attributes:
      label: The new game version
      description: Shown at the top of the screen in the game.
      placeholder: 0.12.0-alpha.1
    validations:
      required: true
  - type: checkboxes
    id: mods
    attributes:
      label: Which mods are affected?
      options:
        - label: Combat Simulator
        - label: Item Sources
        - label: Recipe Rates
        - label: Combat Goals
        - label: Kills in Combat
        - label: Dungeon Completions
  - type: textarea
    id: what
    attributes:
      label: What do you see?
      description: Nothing at all, a message, a wrong number, something drawn in the wrong place. A screenshot helps.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Mod and loader version
      description: 'Both are in MelvorModLoader.log: "Melvor Mod Loader 0.2.0 starting" and "Mod loaded: RecipeRates 0.3.0".'
      placeholder: all six at 0.3.0, loader 0.2.0
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: MelvorModLoader.log
      description: >
        From the game folder, copied after starting the game once on the new version. It names what a mod
        could not find, which is usually all that is needed to fix it. The loader writes your game folder's
        path into it, which you can remove.
      render: text
    validations:
      required: true
